name: v0.8.6 world collision validation

on:
  push:
    branches: [chatgpt-v0.8.6-world-collision]
    paths:
      - 'V8/verdant-reach-v0.8.6/verdant-reach/**'
      - '.github/workflows/world-collision.yml'
  pull_request:
    paths:
      - 'V8/verdant-reach-v0.8.6/verdant-reach/**'
      - '.github/workflows/world-collision.yml'

permissions:
  contents: read

concurrency:
  group: v086-world-collision
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V8/verdant-reach-v0.8.6/verdant-reach
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run game and collision tests
        run: npm test
      - name: Build game
        run: npm run build
