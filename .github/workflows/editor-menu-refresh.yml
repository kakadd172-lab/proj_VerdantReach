name: v0.8.7 shipyard editor and imported-vessel preview

on:
  push:
    branches:
      - main
      - chatgpt-v0.8.6-editor-menu-refresh
      - chatgpt-v0.8.7-vessel-proportion-refinement
      - chatgpt-v0.8.7-imported-ship-library
    paths:
      - 'ForTests/**'
      - '.github/workflows/editor-menu-refresh.yml'
  pull_request:
    paths:
      - 'ForTests/**'
      - '.github/workflows/editor-menu-refresh.yml'

permissions:
  contents: read

concurrency:
  group: shipyard-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ForTests
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ForTests/package.json
      - name: Install editor dependencies
        run: npm install --no-audit --no-fund
      - name: Verify game/editor module identities
        run: npm run check:modules
      - name: Run editor and vessel tests
        run: npm test
      - name: Build shipyard editor
        run: npm run build
      - name: Install browser for interactive smoke test
        run: npx playwright install chromium
      - name: Run interactive editor browser smoke test
        run: npm run smoke
      - name: Upload shipyard browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shipyard-and-imported-vessel-previews
          path: |
            ForTests/galleon-*.png
            ForTests/imported-*.png
          if-no-files-found: warn
