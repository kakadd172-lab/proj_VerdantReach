name: Standalone ForTests ship editor checks
# Keep the v0.8.6 editor adapter module URLs aligned with the game builder.
on:
  push:
    branches: [chatgpt-v0.8.6-modular-ship-generators]
    paths:
      - 'ForTests/**'
      - '.github/workflows/ship-redesign-candidate.yml'
permissions:
  contents: read
concurrency:
  group: v086-modular-editor-checks
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForTests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install candidate dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for the browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Verify the standalone ForTests vessel definitions and shared geometry engine
        run: npm run check:modules
      - name: Run standalone vessel geometry and editor integration tests
        run: npm test
      - name: Build the standalone modular ship editor
        run: npm run build
      - name: Verify all 16 standalone vessel generators load in the editor
        run: npm run smoke
