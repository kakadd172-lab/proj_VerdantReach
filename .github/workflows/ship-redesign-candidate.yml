name: Experimental ship redesign candidate checks
on:
  push:
    branches: [chatgpt-v0.8.6-modular-ship-generators]
    paths:
      - 'ForTests/**'
      - 'V8/verdant-reach-v0.8.6/verdant-reach/src/world/ships/**'
      - '.github/workflows/ship-redesign-candidate.yml'
permissions:
  contents: read
concurrency:
  group: v086-modular-editor-checks
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForTests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install candidate dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for the browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Verify the modular game source and editor adapters
        run: npm run check:modules
      - name: Run v0.8.6 game-module geometry and editor integration tests
        run: npm test
      - name: Build the v0.8.6-connected 3D preview
        run: npm run build
      - name: Verify the modular game generators load in the editor
        run: npm run smoke
