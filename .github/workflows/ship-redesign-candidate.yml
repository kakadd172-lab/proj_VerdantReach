name: Standalone ForTests ship editor checks
# Keep the v0.8.6 editor adapter module URLs aligned with the game builder.
on:
  push:
    branches: [main, chatgpt-v0.8.6-modular-ship-generators, chatgpt-v0.8.10-game-ship-architecture-migration, test-integrity-infrastructure]
    paths:
      - 'ForTests/**'
      - '.github/workflows/ship-redesign-candidate.yml'
permissions:
  contents: read
concurrency:
  group: v086-modular-editor-checks-cannon-cleanup
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ForTests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install candidate dependencies
        run: npm install --no-audit --no-fund
      - name: Verify the standalone ForTests vessel definitions and shared geometry engine
        run: npm run check:modules
      - name: Run standalone editor, persistence and 16-vessel generator tests
        run: npm run test:core
      - name: Run Sloop hull reference tests
        run: npm run test:sloop:reference
      - name: Run Sloop geometry and sail tests
        run: npm run test:sloop:geometry
      - name: Run Sloop rigging and state migration tests
        run: npm run test:sloop:rigging
      - name: Run Sloop steering tests
        run: npm run test:sloop:steering
      - name: Run Sloop wind articulation tests
        run: npm run test:sloop:wind
      - name: Run Sloop sail deployment tests
        run: npm run test:sloop:sails
      - name: Run Sloop V2 hull, deck and rigging geometry tests
        run: npm run test:sloop-v2
      - name: Build the standalone modular ship editor
        run: npm run build
      - name: Install Chromium for the browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Verify all 16 standalone vessel generators load in the editor
        run: npm run smoke
