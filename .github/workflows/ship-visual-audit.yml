name: v0.8.10 fleet visual audit
on:
  push:
    branches: [main, chatgpt-v0.8.10-game-ship-architecture-migration, test-integrity-infrastructure]
    paths:
      - 'ForTests/**'
      - '.github/workflows/ship-visual-audit.yml'
permissions:
  contents: read
concurrency:
  group: v0810-fleet-visual-audit
  cancel-in-progress: true
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ForTests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify vessel modules
        run: npm run check:modules
      - name: Build editor
        run: npm run build
      - name: Render every ship for visual inspection
        run: npm run visual-audit
      - name: Upload visual audit renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdantreach-v0810-fleet-render
          path: ForTests/visual-audit/
          if-no-files-found: warn
          retention-days: 7
