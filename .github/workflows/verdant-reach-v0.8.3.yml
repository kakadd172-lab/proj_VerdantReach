name: Verdant Reach v0.8.3

on:
  push:
    branches: [main, chatgpt-v0.8.3-ship-generator]
    paths:
      - 'V8/verdant-reach-v0.8.3/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.3.yml'
  pull_request:
    paths:
      - 'V8/verdant-reach-v0.8.3/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.3.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V8/verdant-reach-v0.8.3/verdant-reach
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
