name: Verdant Reach v0.8.5 validation

on:
  push:
    branches:
      - chatgpt-v0.8.5-modular-fleet
    paths:
      - 'V8/verdant-reach-v0.8.5/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.5.yml'
  pull_request:
    branches:
      - chatgpt-v0.8.4-populated-settlements
    paths:
      - 'V8/verdant-reach-v0.8.5/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.5.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V8/verdant-reach-v0.8.5/verdant-reach
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build production bundle
        run: npm run build
