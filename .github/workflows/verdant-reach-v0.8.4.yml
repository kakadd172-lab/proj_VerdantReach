name: Verdant Reach v0.8.4

on:
  push:
    branches:
      - chatgpt-v0.8.4-populated-settlements
    paths:
      - 'V8/verdant-reach-v0.8.4/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.4.yml'
  pull_request:
    branches:
      - chatgpt-v0.8.4-populated-settlements
    paths:
      - 'V8/verdant-reach-v0.8.4/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.4.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: V8/verdant-reach-v0.8.4/verdant-reach
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: V8/verdant-reach-v0.8.4/verdant-reach/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
