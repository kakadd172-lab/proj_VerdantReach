name: Verdant Reach v0.8.4

on:
  push:
    branches:
      - chatgpt-v0.8.4-populated-settlements
    paths:
      - 'V8/verdant-reach-v0.8.4/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.4.yml'
  pull_request:
    paths:
      - 'V8/verdant-reach-v0.8.4/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.4.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V8/verdant-reach-v0.8.4/verdant-reach
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production site
        run: npm run build
