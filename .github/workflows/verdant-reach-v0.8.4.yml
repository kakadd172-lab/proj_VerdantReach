name: Verdant Reach v0.8.4

on:
  push:
    branches:
      - chatgpt-v0.8.4-populated-settlements
    paths:
      - 'V8/verdant-reach-v0.8.4/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.4.yml'
  pull_request:
    branches:
      - chatgpt-v0.8.4-populated-settlements
    paths:
      - 'V8/verdant-reach-v0.8.4/verdant-reach/**'
      - '.github/workflows/verdant-reach-v0.8.4.yml'
  workflow_dispatch:

concurrency:
  group: verdant-reach-pages
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: V8/verdant-reach-v0.8.4/verdant-reach
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Publish v0.8.4 to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./V8/verdant-reach-v0.8.4/verdant-reach/dist
          publish_branch: gh-pages
          commit_message: 'Publish Verdant Reach v0.8.4'
